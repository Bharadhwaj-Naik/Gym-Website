<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Form</title>
</head>
<body>
    <form class="join-form">
        <h1>Join Power Gym</h1>
        <div class="b1">
            <input type="text" placeholder="First-Name" class="input-box">
            <input type="text" placeholder="Last-Name" class="input-box">
        </div>
        <div class="b2">
            <input type="number" placeholder=" Enter Age" class="input-box">
            <input type="number" placeholder=" Enter Phone Number" class="input-box">
        </div>
        <input type="email" placeholder="Enter Email" class="input-box">
        <div>
            <button>Pay Now</button>
        </div>
    </form>
</body>
</html>
