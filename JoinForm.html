<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Form</title>
    <link rel="stylesheet" href="JoinForm.css">
</head>

<body>
    <form class="join-form">
        <h1 class="form-title">Join Power Gym</h1>
        <div class="b1">
            <input type="text" placeholder="First-Name" class="input-box">
            <input type="text" placeholder="Last-Name" class="input-box">
        </div>
        <div class="b2">
            <input type="number" placeholder=" Enter Age" class="input-box">
            <input type="text" placeholder=" Enter Phone Number" class="input-box">
        </div>
        <input type="email" placeholder="Enter Email I'D" class="email-input-box">
        <input type="text" placeholder="Enter Payment Amount ($)" class="email-input-box">
        <div>
            <button class="pay-btn">Pay Now</button>
        </div>
        <a href="index.html" class="home-link">Back To Home</a>
    </form>
</body>

</html>
